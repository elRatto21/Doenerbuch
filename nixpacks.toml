# Coolify builds this app with Nixpacks. Node comes from package.json "engines".
# Nixpacks' built-in corepack (0.24.1) predates the npm signing-key rotation and can't
# fetch pnpm 10, so install a current corepack before installing dependencies.
[phases.install]
cmds = ["npm install -g corepack@0.36.0", "corepack enable", "pnpm install --frozen-lockfile"]

[start]
cmd = "pnpm start"

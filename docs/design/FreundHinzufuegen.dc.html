<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dönerbuch – Freund hinzufügen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1A17}a:hover{color:#C8321F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F3EE; color: #1B1A17; font-family: 'DM Sans', system-ui, sans-serif; box-sizing: border-box">

  <header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 16px 16px 8px">
    <a href="Freunde.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; border-radius: 12px; border: 2px solid #1B1A17; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Freund hinzufügen</h1>
    <span></span>
  </header>

  <div style="padding: 12px 20px 40px; display: flex; flex-direction: column; gap: 16px">

    <section aria-labelledby="meincode" style="background: {{accent}}; color: #FFFFFF; border: 2px solid #1B1A17; border-radius: 18px; box-shadow: 3px 3px 0 #1B1A17; padding: 16px; display: flex; gap: 14px; align-items: center">
      <div role="img" aria-label="QR-Code mit deinem Freundescode (Platzhalter)" style="width: 112px; height: 112px; flex-shrink: 0; background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 12px; padding: 10px; box-sizing: border-box; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
        <sc-for list="{{qr}}" as="q" hint-placeholder-count="49">
          <div style="{{q.style}}"></div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <h2 id="meincode" style="margin: 0; font-size: 13px; font-weight: 700">Dein Freundescode</h2>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 2px; line-height: 1">DÖN-4K7Q</div>
        <span style="font-size: 12px; line-height: 1.35">Lass den QR-Code scannen oder schick den Link.</span>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 48px; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; color: #1B1A17; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"></path><path d="M5 13v7h14v-7"></path></svg>Link teilen</button>
      <button style="height: 48px; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; color: #1B1A17; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"></path><path d="M8 12h8"></path></svg>QR scannen</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="code" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px">Code oder Name eingeben</label>
      <div style="display: flex; gap: 8px">
        <input id="code" type="text" value="tim" style="flex: 1; min-width: 0; height: 50px; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 500; color: #1B1A17; box-sizing: border-box">
        <button aria-label="Suchen" style="width: 50px; height: 50px; border: 2px solid #1B1A17; border-radius: 12px; background: #1B1A17; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
      </div>
    </div>

    <ul aria-label="Suchergebnisse" style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; overflow: hidden">
      <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1.5px solid #E6E2D6">
          <span style="width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid #1B1A17; background: #F5F3EE; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.ini}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-weight: 700; font-size: 15px">{{r.name}}</span>
            <span style="font-size: 12px; color: #5E5A52">{{r.meta}}</span>
          </span>
          <button onClick="{{r.toggle}}" style="{{r.btnStyle}}">{{r.btn}}</button>
        </li>
      </sc-for>
    </ul>

    <section aria-labelledby="anfragen" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="anfragen" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px">Anfragen an dich</h2>
      <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; padding: 10px 12px; box-shadow: 3px 3px 0 #1B1A17">
        <span style="width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid #1B1A17; background: #F6B814; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">SA</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-weight: 700; font-size: 15px">Selin</span>
          <span style="font-size: 12px; color: #5E5A52">23 Döner · 2 gemeinsame Freunde</span>
        </span>
        <button aria-label="Ablehnen" style="width: 40px; height: 40px; border: 2px solid #1B1A17; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        <button aria-label="Annehmen" style="width: 40px; height: 40px; border: 2px solid #1B1A17; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8321F","options":["#C8321F","#1F6FC8","#2E7D4F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8321F';
    const sent = (this.state && this.state.sent) || { tk: false, tw: true };
    const pattern = '1110111101010110111011000001101011010111011010111';
    const res = [
      { id: 'tk', ini: 'TK', name: 'Tim K.', meta: '@timkebab · 41 Döner' },
      { id: 'tw', ini: 'TW', name: 'Tim W.', meta: '@timw · 12 Döner' },
      { id: 'tb', ini: 'TB', name: 'Tobi', meta: '@tobi_d · bereits befreundet', friend: true }
    ];
    return {
      accent,
      qr: pattern.split('').map((c) => ({ style: 'aspect-ratio: 1; border-radius: 2px; background: ' + (c === '1' ? '#1B1A17' : '#FFFFFF') })),
      results: res.map((r) => {
        const s = !!sent[r.id];
        const base = 'height: 36px; padding: 0 12px; border: 2px solid #1B1A17; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; ';
        return {
          ...r,
          btn: r.friend ? 'Freunde' : (s ? 'Angefragt' : 'Hinzufügen'),
          btnStyle: base + (r.friend || s ? 'background: #F5F3EE; color: #5E5A52' : 'background: #F6B814; color: #1B1A17'),
          toggle: () => { if (r.friend) return; const n = { ...sent }; n[r.id] = !s; this.setState({ sent: n }); }
        };
      })
    };
  }
}
</script>
</body>
</html>

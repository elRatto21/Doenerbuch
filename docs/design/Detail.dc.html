<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dönerbuch – Eintrag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1A17}a:hover{color:#C8321F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F3EE; color: #1B1A17; font-family: 'DM Sans', system-ui, sans-serif; box-sizing: border-box">

  <div role="img" aria-label="Foto vom Döner (Platzhalter)" style="height: 220px; background: repeating-linear-gradient(45deg, #E6E2D6 0 14px, #DDD8CA 14px 28px); border-bottom: 2px solid #1B1A17; display: flex; align-items: center; justify-content: center; position: relative">
    <span style="background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700">[Foto vom Döner]</span>
    <a href="Main.dc.html" aria-label="Zurück zum Journal" style="position: absolute; left: 16px; top: 16px; width: 44px; height: 44px; border-radius: 12px; border: 2px solid #1B1A17; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <button aria-label="Bearbeiten" style="position: absolute; right: 16px; top: 16px; width: 44px; height: 44px; border-radius: 12px; border: 2px solid #1B1A17; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
  </div>

  <div style="padding: 16px 20px 110px; display: flex; flex-direction: column; gap: 14px">
    <div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5E5A52">
        <span style="background: #F6B814; color: #1B1A17; border: 1.5px solid #1B1A17; border-radius: 6px; padding: 2px 8px; font-weight: 700; font-size: 12px">Dürüm · Kalb</span>
        Di, 27. Oktober · 12:40
      </div>
      <h1 style="margin: 8px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.5px; line-height: 1.05">Bosporus Grill</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="background: {{accent}}; color: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; padding: 10px 12px; box-shadow: 3px 3px 0 #1B1A17">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1">5,0 ★</div>
        <div style="font-size: 12px; margin-top: 4px">Bewertung</div>
      </div>
      <div style="background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; padding: 10px 12px; box-shadow: 3px 3px 0 #1B1A17">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1">€ 7,50</div>
        <div style="font-size: 12px; color: #5E5A52; margin-top: 4px">Preis</div>
      </div>
      <div style="background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; padding: 10px 12px; box-shadow: 3px 3px 0 #1B1A17">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1">8×</div>
        <div style="font-size: 12px; color: #5E5A52; margin-top: 4px">hier gewesen</div>
      </div>
    </div>

    <section aria-label="Bewertung im Detail" style="background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{c.label}}</span><span style="font-weight: 700">{{c.v}}</span></div>
          <div style="height: 8px; border: 1.5px solid #1B1A17; border-radius: 5px; background: #F5F3EE; overflow: hidden"><div style="{{c.bar}}"></div></div>
        </div>
      </sc-for>
    </section>

    <section aria-label="Ort" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; padding: 10px">
      <div aria-hidden="true" style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; border: 1.5px solid #1B1A17; background: #E6E2D6; position: relative; overflow: hidden">
        <div style="position: absolute; left: -10px; right: -10px; top: 26px; height: 8px; background: #FFFFFF; transform: rotate(-10deg)"></div>
        <div style="position: absolute; left: 24px; top: 24px; width: 14px; height: 14px; border-radius: 7px; background: {{accent}}; border: 3px solid #FFFFFF; box-sizing: border-box"></div>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-weight: 700; font-size: 15px">Hauptstraße 12</div>
        <div style="font-size: 13px; color: #5E5A52">GPS erfasst · ±8 m</div>
      </div>
      <a href="Karte.dc.html" style="height: 40px; padding: 0 12px; border: 2px solid #1B1A17; border-radius: 10px; background: #F6B814; color: #1B1A17; font-weight: 700; font-size: 13px; text-decoration: none; display: flex; align-items: center">Karte</a>
    </section>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <p style="margin: 0; font-size: 15px; line-height: 1.45">„Extra scharf, Brot frisch vom Grill. Bester Dürüm in der Stadt.“</p>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5E5A52">
        <span style="width: 28px; height: 28px; border-radius: 14px; background: #F6B814; border: 1.5px solid #1B1A17; color: #1B1A17; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">LM</span>
        Gegessen mit <a href="Freunde.dc.html" style="font-weight: 700">Lena</a>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 24px; background: #F5F3EE; border-top: 2px solid #1B1A17; display: flex; gap: 10px">
    <a href="NeuerEintrag.dc.html" style="flex: 1; height: 52px; border-radius: 14px; background: {{accent}}; border: 2px solid #1B1A17; box-shadow: 3px 3px 0 #1B1A17; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5"></path><path d="M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"></path></svg>Nochmal hier</a>
    <button aria-label="Teilen" style="width: 52px; height: 52px; border-radius: 14px; border: 2px solid #1B1A17; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"></path><path d="M5 13v7h14v-7"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8321F","options":["#C8321F","#1F6FC8","#2E7D4F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8321F';
    const c = [['Fleisch', 5], ['Brot', 4], ['Sauce', 5], ['Salat', 4], ['Portion', 4], ['Preis/Leistung', 5]];
    return {
      accent,
      cats: c.map(([label, v]) => ({ label, v: v + '/5', bar: 'height: 100%; width: ' + (v * 20) + '%; background: ' + (v === 5 ? accent : '#F6B814') }))
    };
  }
}
</script>
</body>
</html>

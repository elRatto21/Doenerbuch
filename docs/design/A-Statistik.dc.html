<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dönerbuch – Statistik (A)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1A17}a:hover{color:#C8321F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F3EE; color: #1B1A17; font-family: 'DM Sans', system-ui, sans-serif; box-sizing: border-box">

  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.5px">Statistik</h1>
    <div role="tablist" aria-label="Zeitraum" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; padding: 3px; gap: 3px">
      <button role="tab" aria-selected="false" style="height: 38px; border: 0; border-radius: 10px; background: transparent; font-family: inherit; font-weight: 500; font-size: 14px; color: #5E5A52; cursor: pointer">Monat</button>
      <button role="tab" aria-selected="true" style="height: 38px; border: 0; border-radius: 10px; background: #1B1A17; font-family: inherit; font-weight: 700; font-size: 14px; color: #FFFFFF; cursor: pointer">2026</button>
      <button role="tab" aria-selected="false" style="height: 38px; border: 0; border-radius: 10px; background: transparent; font-family: inherit; font-weight: 500; font-size: 14px; color: #5E5A52; cursor: pointer">Gesamt</button>
    </div>
  </header>

  <div style="padding: 0 20px 110px; display: flex; flex-direction: column; gap: 14px">

    <section aria-label="Überblick" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: {{accent}}; color: #FFFFFF; border: 2px solid #1B1A17; border-radius: 16px; padding: 14px; box-shadow: 3px 3px 0 #1B1A17">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">47</div>
        <div style="font-size: 13px; margin-top: 6px">Döner gegessen</div>
      </div>
      <div style="background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 16px; padding: 14px; box-shadow: 3px 3px 0 #1B1A17">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">€ 362</div>
        <div style="font-size: 13px; color: #5E5A52; margin-top: 6px">ausgegeben · Ø € 7,70</div>
      </div>
    </section>

    <section aria-labelledby="sorten" style="background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 16px; padding: 14px; box-shadow: 3px 3px 0 #1B1A17; display: flex; flex-direction: column; gap: 10px">
      <h2 id="sorten" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">Was du isst</h2>
      <sc-for list="{{types}}" as="t" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 84px 1fr 28px; align-items: center; gap: 10px; font-size: 14px">
          <span style="font-weight: 500">{{t.label}}</span>
          <div style="height: 14px; background: #F5F3EE; border: 1.5px solid #1B1A17; border-radius: 7px; overflow: hidden">
            <div style="{{t.barStyle}}"></div>
          </div>
          <span style="font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{t.n}}</span>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="beste" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="beste" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">Die Besten je Sorte</h2>
      <sc-for list="{{best}}" as="b" hint-placeholder-count="3">
        <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; padding: 10px 12px; text-decoration: none; color: #1B1A17">
          <span style="background: #F6B814; border: 1.5px solid #1B1A17; border-radius: 8px; font-weight: 700; font-size: 12px; padding: 4px 8px; width: 74px; text-align: center; flex-shrink: 0">{{b.type}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px">{{b.name}}</span>
            <span style="font-size: 12px; color: #5E5A52">{{b.meta}}</span>
          </span>
          <span style="display: flex; align-items: center; gap: 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#F6B814" stroke="#1B1A17" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>{{b.score}}</span>
        </a>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 2px solid #1B1A17; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 8px 10px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5E5A52; font-size: 11px; font-weight: 500; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"></path><path d="M4 17a3 3 0 0 1 3-3h11"></path></svg>Journal</a>
    <a href="Karte.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5E5A52; font-size: 11px; font-weight: 500; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Karte</a>
    <a href="NeuerEintrag.dc.html" aria-label="Neuen Döner eintragen" style="justify-self: center; width: 58px; height: 58px; margin-top: -26px; border-radius: 18px; background: {{accent}}; border: 2px solid #1B1A17; box-shadow: 3px 3px 0 #1B1A17; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Freunde.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5E5A52; font-size: 11px; font-weight: 500; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a6.5 6.5 0 0 1 3.5 6"></path></svg>Freunde</a>
    <a href="A-Statistik.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Statistik</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8321F","options":["#C8321F","#1F6FC8","#2E7D4F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8321F';
    const t = [['Döner', 19], ['Dürüm', 12], ['Döner-Box', 8], ['Lahmacun', 5], ['Teller', 3]];
    const max = 19;
    return {
      accent,
      types: t.map(([label, n], i) => ({ label, n, barStyle: 'height: 100%; width: ' + Math.round(n / max * 100) + '%; background: ' + (i === 0 ? accent : '#F6B814') + '; border-right: 1.5px solid #1B1A17' })),
      best: [
        { type: 'Döner-Box', name: 'Kebap Haus Ece', meta: '4× gegessen · Ø € 8,00', score: '4,8' },
        { type: 'Dürüm', name: 'Bosporus Grill', meta: '7× gegessen · Ø € 7,50', score: '4,7' },
        { type: 'Döner', name: 'Anatolia Imbiss', meta: '9× gegessen · Ø € 6,90', score: '4,4' }
      ]
    };
  }
}
</script>
</body>
</html>

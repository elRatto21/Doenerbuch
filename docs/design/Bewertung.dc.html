<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dönerbuch – Bewertung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1A17}a:hover{color:#C8321F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F3EE; color: #1B1A17; font-family: 'DM Sans', system-ui, sans-serif; box-sizing: border-box">

  <header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 16px 16px 8px">
    <a href="NeuerEintrag.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; border-radius: 12px; border: 2px solid #1B1A17; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Bewertung</h1>
    <span style="font-size: 13px; font-weight: 700; text-align: right; color: #5E5A52">2/2</span>
  </header>
  <div aria-hidden="true" style="margin: 4px 20px 0; height: 8px; border: 2px solid #1B1A17; border-radius: 6px; background: {{accent}}"></div>

  <div style="padding: 14px 20px 120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px">
      <span style="background: #F6B814; border: 1.5px solid #1B1A17; border-radius: 6px; padding: 2px 8px; font-weight: 700; font-size: 12px">Dürüm</span>
      <span style="font-weight: 700">Bosporus Grill</span>
      <span style="color: #5E5A52">· € 7,50</span>
    </div>

    <section aria-labelledby="gesamt" style="background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 16px; padding: 14px; box-shadow: 3px 3px 0 #1B1A17; display: flex; align-items: center; justify-content: space-between">
      <div>
        <h2 id="gesamt" style="margin: 0; font-size: 13px; font-weight: 700; color: #5E5A52">Gesamt</h2>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1">{{overall}}<span style="font-size: 20px; color: #5E5A52">/5</span></div>
      </div>
      <div role="radiogroup" aria-label="Gesamtbewertung" style="display: flex; gap: 2px">
        <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{s.on}}" aria-label="{{s.label}}" onClick="{{s.pick}}" style="width: 40px; height: 44px; border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="#1B1A17" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="kat" style="background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <h2 id="kat" style="margin: 0 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px">Im Detail</h2>
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <div role="radiogroup" aria-label="{{c.label}}" style="display: grid; grid-template-columns: 104px 1fr; align-items: center; gap: 10px">
          <span style="font-size: 14px; font-weight: 500">{{c.label}}</span>
          <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
            <sc-for list="{{c.segs}}" as="g" hint-placeholder-count="5">
              <button type="button" role="radio" aria-checked="{{g.on}}" aria-label="{{g.label}}" onClick="{{g.pick}}" style="{{g.style}}"></button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="wer" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="wer" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px">Mit wem?</h2>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 12px 0 4px; border: 2px solid #1B1A17; border-radius: 20px; background: #F6B814; font-family: inherit; font-weight: 700; font-size: 14px; color: #1B1A17; display: flex; align-items: center; gap: 6px; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #1B1A17; font-size: 11px; display: flex; align-items: center; justify-content: center">LM</span>Lena</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 12px 0 4px; border: 2px solid #1B1A17; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-weight: 500; font-size: 14px; color: #1B1A17; display: flex; align-items: center; gap: 6px; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 14px; background: #F5F3EE; border: 1.5px solid #1B1A17; font-size: 11px; display: flex; align-items: center; justify-content: center">TK</span>Tim</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 12px 0 4px; border: 2px solid #1B1A17; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-weight: 500; font-size: 14px; color: #1B1A17; display: flex; align-items: center; gap: 6px; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 14px; background: #F5F3EE; border: 1.5px solid #1B1A17; font-size: 11px; display: flex; align-items: center; justify-content: center">JB</span>Jonas</button>
        <button type="button" aria-label="Freund hinzufügen" style="width: 40px; height: 40px; border: 2px dashed #1B1A17; border-radius: 20px; background: transparent; color: #1B1A17; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </section>

    <div style="display: flex; gap: 8px">
      <label for="notiz" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Notiz</label>
      <textarea id="notiz" rows="2" placeholder="Notiz, z. B. „extra scharf, Brot frisch“" style="flex: 1; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; padding: 10px 12px; font-family: inherit; font-size: 14px; color: #1B1A17; resize: none; box-sizing: border-box"></textarea>
      <button type="button" aria-label="Foto hinzufügen" style="width: 60px; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; color: #1B1A17; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 24px; background: #F5F3EE; border-top: 2px solid #1B1A17">
    <a href="Detail.dc.html" style="height: 56px; border-radius: 14px; background: {{accent}}; border: 2px solid #1B1A17; box-shadow: 3px 3px 0 #1B1A17; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Ins Dönerbuch eintragen</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8321F","options":["#C8321F","#1F6FC8","#2E7D4F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8321F';
    const st = this.state || {};
    const overall = st.overall ?? 5;
    const names = ['Fleisch', 'Brot', 'Sauce', 'Salat & Gemüse', 'Portion', 'Preis/Leistung'];
    const defaults = [5, 4, 5, 4, 4, 5];
    const vals = st.cats || defaults;
    return {
      accent,
      overall: String(overall),
      stars: [1, 2, 3, 4, 5].map((i) => ({
        fill: i <= overall ? '#F6B814' : '#FFFFFF', on: i === overall ? 'true' : 'false', label: i + ' Sterne',
        pick: () => this.setState({ overall: i })
      })),
      cats: names.map((label, ci) => ({
        label,
        segs: [1, 2, 3, 4, 5].map((i) => ({
          on: i === vals[ci] ? 'true' : 'false', label: label + ': ' + i + ' von 5',
          style: 'height: 22px; border: 1.5px solid #1B1A17; border-radius: 6px; padding: 0; cursor: pointer; background: ' + (i <= vals[ci] ? (i === 5 ? accent : '#F6B814') : '#F5F3EE'),
          pick: () => { const n = vals.slice(); n[ci] = i; this.setState({ cats: n }); }
        }))
      }))
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dönerbuch – Karte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1A17}a:hover{color:#C8321F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E6E2D6; color: #1B1A17; font-family: 'DM Sans', system-ui, sans-serif; box-sizing: border-box">

  <div aria-hidden="true" style="position: absolute; inset: 0">
    <div style="position: absolute; left: -40px; right: -40px; top: 300px; height: 22px; background: #FFFFFF; transform: rotate(-12deg)"></div>
    <div style="position: absolute; left: -40px; right: -40px; top: 520px; height: 16px; background: #FFFFFF; transform: rotate(6deg)"></div>
    <div style="position: absolute; top: -40px; bottom: -40px; left: 140px; width: 18px; background: #FFFFFF; transform: rotate(10deg)"></div>
    <div style="position: absolute; top: -40px; bottom: -40px; left: 290px; width: 12px; background: #FFFFFF; transform: rotate(-4deg)"></div>
    <div style="position: absolute; left: -40px; right: -40px; top: 170px; height: 10px; background: #FFFFFF"></div>
    <div style="position: absolute; left: 20px; top: 380px; width: 100px; height: 90px; border-radius: 18px; background: #C9D9B8"></div>
    <div style="position: absolute; left: 230px; top: 40px; width: 180px; height: 110px; border-radius: 30px; background: #B9D3E0"></div>
    <div style="position: absolute; left: 190px; top: 610px; width: 130px; height: 70px; border-radius: 14px; background: #C9D9B8"></div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px">
      <label for="suche" style="flex: 1; height: 50px; border: 2px solid #1B1A17; border-radius: 14px; background: #FFFFFF; box-shadow: 3px 3px 0 #1B1A17; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Imbiss suchen</span>
        <input id="suche" type="search" placeholder="Imbiss suchen" style="border: 0; outline: none; flex: 1; min-width: 0; font-family: inherit; font-size: 16px; color: #1B1A17; background: transparent">
      </label>
      <button aria-label="Mein Standort" style="width: 50px; height: 50px; border: 2px solid #1B1A17; border-radius: 14px; background: #FFFFFF; box-shadow: 3px 3px 0 #1B1A17; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="7.5"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"></path></svg></button>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button aria-pressed="true" style="height: 36px; padding: 0 14px; border: 2px solid #1B1A17; border-radius: 18px; background: #1B1A17; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Alle</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border: 2px solid #1B1A17; border-radius: 18px; background: #FFFFFF; color: #1B1A17; font-family: inherit; font-weight: 500; font-size: 13px; cursor: pointer">Meine</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border: 2px solid #1B1A17; border-radius: 18px; background: #FFFFFF; color: #1B1A17; font-family: inherit; font-weight: 500; font-size: 13px; cursor: pointer">Freunde</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border: 2px solid #1B1A17; border-radius: 18px; background: #FFFFFF; color: #1B1A17; font-family: inherit; font-weight: 500; font-size: 13px; cursor: pointer">Ab 4 ★</button>
    </div>
  </div>

  <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
    <button aria-label="{{p.label}}" style="{{p.style}}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>{{p.r}}</button>
  </sc-for>
  <div aria-hidden="true" style="position: absolute; left: 196px; top: 452px; width: 20px; height: 20px; border-radius: 10px; background: #1F6FC8; border: 3px solid #FFFFFF; box-shadow: 0 0 0 8px rgba(31,111,200,0.2)"></div>

  <a href="Detail.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 100px; background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 18px; box-shadow: 3px 3px 0 #1B1A17; padding: 14px; display: flex; gap: 12px; align-items: center; text-decoration: none; color: #1B1A17">
    <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; background: {{accent}}; border: 2px solid #1B1A17; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">4,7</span>
      <span style="font-size: 10px; font-weight: 700; margin-top: 2px">Ø 8×</span>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">Bosporus Grill</span>
      <span style="font-size: 13px; color: #5E5A52">Hauptstraße 12 · 350 m</span>
      <span style="font-size: 12px; color: #5E5A52">Zuletzt heute · Lena war auch hier</span>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 2px solid #1B1A17; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 8px 10px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5E5A52; font-size: 11px; font-weight: 500; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"></path><path d="M4 17a3 3 0 0 1 3-3h11"></path></svg>Journal</a>
    <a href="Karte.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Karte</a>
    <a href="NeuerEintrag.dc.html" aria-label="Neuen Döner eintragen" style="justify-self: center; width: 58px; height: 58px; margin-top: -26px; border-radius: 18px; background: {{accent}}; border: 2px solid #1B1A17; box-shadow: 3px 3px 0 #1B1A17; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Freunde.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5E5A52; font-size: 11px; font-weight: 500; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a6.5 6.5 0 0 1 3.5 6"></path></svg>Freunde</a>
    <a href="A-Statistik.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5E5A52; font-size: 11px; font-weight: 500; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Statistik</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8321F","options":["#C8321F","#1F6FC8","#2E7D4F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8321F';
    const pins = [
      { x: 150, y: 400, r: '4,7', n: 'Bosporus Grill', sel: true },
      { x: 60, y: 250, r: '4,4', n: 'Anatolia Imbiss' },
      { x: 260, y: 220, r: '4,8', n: 'Kebap Haus Ece' },
      { x: 280, y: 360, r: '3,5', n: 'Lahmacun Ustası' },
      { x: 40, y: 540, r: '4,2', n: 'Mangal Ocakbaşı' },
      { x: 300, y: 500, r: '3,9', n: 'Efe Grill', friend: true }
    ];
    return {
      accent,
      pins: pins.map((p) => ({
        r: p.r, label: p.n + ', ' + p.r + ' Sterne',
        style: 'position: absolute; left: ' + p.x + 'px; top: ' + p.y + 'px; height: 34px; padding: 0 10px; border: 2px solid #1B1A17; border-radius: 17px; display: flex; align-items: center; gap: 4px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 2px 2px 0 #1B1A17; ' +
          (p.sel ? 'background: ' + accent + '; color: #FFFFFF; transform: scale(1.15)' : p.friend ? 'background: #FFFFFF; color: #1B1A17; border-style: dashed' : 'background: #F6B814; color: #1B1A17')
      }))
    };
  }
}
</script>
</body>
</html>

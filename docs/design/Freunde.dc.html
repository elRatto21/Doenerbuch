<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dönerbuch – Freunde</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1A17}a:hover{color:#C8321F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F3EE; color: #1B1A17; font-family: 'DM Sans', system-ui, sans-serif; box-sizing: border-box">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.5px">Freunde</h1>
    <a href="FreundHinzufuegen.dc.html" style="height: 44px; padding: 0 14px; border: 2px solid #1B1A17; border-radius: 12px; background: #F6B814; box-shadow: 2px 2px 0 #1B1A17; font-weight: 700; font-size: 14px; color: #1B1A17; display: flex; align-items: center; gap: 6px; text-decoration: none; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M19 8v6M16 11h6"></path></svg>Hinzufügen</a>
  </header>

  <section aria-labelledby="rang" style="margin: 0 20px; background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 16px; box-shadow: 3px 3px 0 #1B1A17; padding: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 id="rang" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">Rangliste Oktober</h2>
      <span style="font-size: 12px; color: #5E5A52">nach Anzahl Döner</span>
    </div>
    <ol style="list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{ranking}}" as="r" hint-placeholder-count="4">
        <li style="{{r.rowStyle}}">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; width: 22px">{{r.rank}}</span>
          <span style="width: 32px; height: 32px; border-radius: 16px; border: 1.5px solid #1B1A17; background: {{r.avatarBg}}; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.ini}}</span>
          <span style="flex: 1; font-weight: {{r.weight}}; font-size: 15px">{{r.name}}</span>
          <span style="font-size: 13px; color: #5E5A52">Ø {{r.avg}} ★</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; width: 30px; text-align: right">{{r.n}}</span>
        </li>
      </sc-for>
    </ol>
  </section>

  <h2 style="margin: 20px 20px 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">Was deine Freunde essen</h2>
  <ul style="list-style: none; margin: 0; padding: 0 20px 110px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{feed}}" as="f" hint-placeholder-count="3">
      <li style="background: #FFFFFF; border: 2px solid #1B1A17; border-radius: 14px; padding: 12px; display: flex; gap: 10px">
        <span style="width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid #1B1A17; background: {{f.avatarBg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{f.ini}}</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 14px; line-height: 1.35"><strong>{{f.name}}</strong> war bei <strong>{{f.place}}</strong>{{f.tag}}</div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5E5A52">
            <span style="background: #F6B814; color: #1B1A17; border: 1.5px solid #1B1A17; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 11px">{{f.type}}</span>
            <span style="font-weight: 700; color: #1B1A17">{{f.r}} ★</span>
            <span>{{f.price}}</span>
            <span>· {{f.when}}</span>
          </div>
        </div>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 2px solid #1B1A17; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 8px 10px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5E5A52; font-size: 11px; font-weight: 500; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"></path><path d="M4 17a3 3 0 0 1 3-3h11"></path></svg>Journal</a>
    <a href="Karte.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5E5A52; font-size: 11px; font-weight: 500; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Karte</a>
    <a href="NeuerEintrag.dc.html" aria-label="Neuen Döner eintragen" style="justify-self: center; width: 58px; height: 58px; margin-top: -26px; border-radius: 18px; background: {{accent}}; border: 2px solid #1B1A17; box-shadow: 3px 3px 0 #1B1A17; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Freunde.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a6.5 6.5 0 0 1 3.5 6"></path></svg>Freunde</a>
    <a href="A-Statistik.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5E5A52; font-size: 11px; font-weight: 500; min-height: 44px; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Statistik</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8321F","options":["#C8321F","#1F6FC8","#2E7D4F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8321F';
    const rk = [
      { name: 'Tim', ini: 'TK', n: 9, avg: '3,8' },
      { name: 'Du', ini: 'NT', n: 6, avg: '4,2', me: true },
      { name: 'Lena', ini: 'LM', n: 5, avg: '4,4' },
      { name: 'Jonas', ini: 'JB', n: 3, avg: '4,0' }
    ];
    return {
      accent,
      ranking: rk.map((r, i) => ({
        ...r, rank: String(i + 1), weight: r.me ? '700' : '500',
        avatarBg: i === 0 ? '#F6B814' : '#F5F3EE',
        rowStyle: 'display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; ' + (r.me ? 'background: #FBE3DF; border: 1.5px solid #1B1A17' : 'border: 1.5px solid transparent')
      })),
      feed: [
        { name: 'Tim', ini: 'TK', avatarBg: '#F6B814', place: 'Kebap Haus Ece', tag: '', type: 'Döner-Box', r: '4,5', price: '€ 8,00', when: 'vor 2 Std.' },
        { name: 'Lena', ini: 'LM', avatarBg: '#F5F3EE', place: 'Bosporus Grill', tag: ' mit dir', type: 'Dürüm', r: '5,0', price: '€ 7,50', when: 'heute' },
        { name: 'Jonas', ini: 'JB', avatarBg: '#F5F3EE', place: 'Efe Grill', tag: ' – neuer Spot!', type: 'Döner', r: '3,5', price: '€ 6,50', when: 'gestern' }
      ]
    };
  }
}
</script>
</body>
</html>

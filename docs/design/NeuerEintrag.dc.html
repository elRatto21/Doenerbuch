<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dönerbuch – Neuer Döner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1A17}a:hover{color:#C8321F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F3EE; color: #1B1A17; font-family: 'DM Sans', system-ui, sans-serif; box-sizing: border-box">

  <header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 16px 16px 8px">
    <a href="Main.dc.html" aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 12px; border: 2px solid #1B1A17; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 style="margin: 0; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Neuer Döner</h1>
    <span style="font-size: 13px; font-weight: 700; text-align: right; color: #5E5A52">1/2</span>
  </header>
  <div aria-hidden="true" style="margin: 4px 20px 0; height: 8px; border: 2px solid #1B1A17; border-radius: 6px; background: #FFFFFF; overflow: hidden"><div style="width: 50%; height: 100%; background: {{accent}}"></div></div>

  <form style="padding: 16px 20px 120px; display: flex; flex-direction: column; gap: 18px">

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px; padding: 0; margin-bottom: 8px">Wann?</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" style="height: 48px; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #1B1A17; display: flex; align-items: center; gap: 8px; padding: 0 12px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Heute, 27.10.</button>
        <button type="button" style="height: 48px; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #1B1A17; display: flex; align-items: center; gap: 8px; padding: 0 12px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>12:40</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px; padding: 0; margin-bottom: 8px">Was?</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
      <div role="radiogroup" aria-label="Fleisch" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 10px; border: 2px solid #1B1A17; border-radius: 12px; overflow: hidden; background: #FFFFFF">
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border: 0; background: #1B1A17; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Kalb</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border: 0; border-left: 2px solid #1B1A17; background: #FFFFFF; color: #1B1A17; font-family: inherit; font-weight: 500; font-size: 13px; cursor: pointer">Hähnchen</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border: 0; border-left: 2px solid #1B1A17; background: #FFFFFF; color: #1B1A17; font-family: inherit; font-weight: 500; font-size: 13px; cursor: pointer">Gemischt</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border: 0; border-left: 2px solid #1B1A17; background: #FFFFFF; color: #1B1A17; font-family: inherit; font-weight: 500; font-size: 13px; cursor: pointer">Veggie</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px; padding: 0; margin-bottom: 8px">Wo?</legend>
      <label for="ort" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Name des Imbiss</label>
      <input id="ort" type="text" value="Bosporus Grill" style="height: 48px; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 500; color: #1B1A17; box-sizing: border-box; width: 100%">
      <div style="border: 2px solid #1B1A17; border-radius: 14px; background: #FFFFFF; overflow: hidden; box-shadow: 3px 3px 0 #1B1A17">
        <div aria-hidden="true" style="height: 92px; position: relative; background: #E6E2D6; overflow: hidden">
          <div style="position: absolute; left: -20px; right: -20px; top: 38px; height: 14px; background: #FFFFFF; transform: rotate(-8deg)"></div>
          <div style="position: absolute; top: -20px; bottom: -20px; left: 120px; width: 12px; background: #FFFFFF; transform: rotate(12deg)"></div>
          <div style="position: absolute; top: -20px; bottom: -20px; left: 250px; width: 10px; background: #FFFFFF"></div>
          <div style="position: absolute; left: 290px; top: 60px; width: 60px; height: 50px; border-radius: 8px; background: #C9D9B8"></div>
          <div style="position: absolute; left: 165px; top: 30px; width: 40px; height: 40px; border-radius: 20px; background: rgba(200,50,31,0.18)"></div>
          <div style="position: absolute; left: 177px; top: 42px; width: 16px; height: 16px; border-radius: 8px; background: {{accent}}; border: 3px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 0 0 2px #1B1A17"></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-top: 2px solid #1B1A17">
          <div style="display: flex; flex-direction: column">
            <span style="font-weight: 700; font-size: 14px">Standort erfasst</span>
            <span style="font-size: 12px; color: #5E5A52">Hauptstraße 12 · ±8 m</span>
          </div>
          <button type="button" style="height: 40px; padding: 0 12px; border: 2px solid #1B1A17; border-radius: 10px; background: #F6B814; font-family: inherit; font-weight: 700; font-size: 13px; color: #1B1A17; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>Neu orten</button>
        </div>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="preis" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px">Preis</label>
      <div style="display: flex; gap: 8px">
        <div style="flex: 1; height: 52px; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; padding: 0 14px; gap: 6px; box-sizing: border-box">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">€</span>
          <input id="preis" type="text" inputmode="decimal" value="7,50" style="border: 0; outline: none; width: 100%; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; color: #1B1A17; background: transparent">
        </div>
        <button type="button" style="height: 52px; padding: 0 12px; border: 2px solid #1B1A17; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-weight: 500; font-size: 13px; color: #1B1A17; cursor: pointer">wie letztes Mal</button>
      </div>
    </div>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 24px; background: #F5F3EE; border-top: 2px solid #1B1A17">
    <a href="Bewertung.dc.html" style="height: 56px; border-radius: 14px; background: {{accent}}; border: 2px solid #1B1A17; box-shadow: 3px 3px 0 #1B1A17; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">Weiter zur Bewertung
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8321F","options":["#C8321F","#1F6FC8","#2E7D4F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = (this.state && this.state.picked) || 'Dürüm';
    const labels = ['Döner', 'Dürüm', 'Döner-Box', 'Lahmacun', 'Teller', 'Yufka', 'Pide'];
    return {
      accent: this.props.accent ?? '#C8321F',
      types: labels.map((label) => {
        const on = label === picked;
        return {
          label, on: on ? 'true' : 'false',
          style: 'height: 40px; padding: 0 14px; border: 2px solid #1B1A17; border-radius: 20px; font-family: inherit; font-size: 14px; cursor: pointer; color: #1B1A17; ' + (on ? 'background: #F6B814; font-weight: 700; box-shadow: 2px 2px 0 #1B1A17' : 'background: #FFFFFF; font-weight: 500'),
          pick: () => this.setState({ picked: label })
        };
      })
    };
  }
}
</script>
</body>
</html>
